<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hotel</title>
    <link rel="stylesheet" href="style.css" />

    <!-- three.js from a CDN: no build step, works on any static host (InfinityFree included) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="viewport"></div>

<!-- Start screen. Its real content is in entrance.html (loaded by js/main.js);
     what's below is only a fallback in case entrance.html can't be loaded. -->
<div id="start" class="overlay">
    <div class="panel">
        <button id="enter-btn" disabled>Loading…</button>
        <p class="hint">WASD walk · Shift run · Mouse look · Click / F shoot · E interact · Esc pause</p>
        <p id="data-mode" class="hint"></p>
    </div>
</div>

<!-- Pause screen -->
<div id="pause" class="overlay hidden">
    <div class="panel">
        <p>Paused</p>
        <button id="resume-btn">Resume</button>
    </div>
</div>

<!-- Read a reply in full -->
<div id="reader" class="overlay hidden">
    <div class="panel reader">
        <p class="meta"><b id="reader-poster"></b> <span id="reader-date"></span></p>
        <div id="reader-body"></div>
        <button id="reader-close">Back</button>
    </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="prompt" class="hidden"></div>
    <div id="room-label" class="hidden"></div>
    <div id="online" class="hidden"></div>
    <div id="toast" class="hidden"></div>
</div>

<!-- Shown while sitting at a computer -->
<div id="seatbar" class="bar hidden">
    <span id="seat-hint" class="desktop-only"></span>
    <button id="field-btn" type="button">Next field</button>
    <button id="post-btn" type="button">Post</button>
    <button id="attach-btn" type="button">Attach image</button>
    <button id="keyboard-btn" type="button" class="touch-only">Keyboard</button>
    <button id="stand-btn" type="button">Stand up</button>
</div>

<!-- Shown while looking at an image cube -->
<div id="inspectbar" class="bar hidden">
    <span>Drag to turn</span>
    <span class="desktop-only">E / Esc: step back</span>
    <button id="inspect-back" type="button">Back</button>
</div>

<!-- The computer screen in 3D mirrors this hidden textarea (gives us paste, IME, arrow keys for free) -->
<textarea id="term-input" aria-label="Reply text" spellcheck="false"></textarea>
<input id="file-input" type="file" accept="image/png,image/jpeg,image/gif" hidden />

<script type="module" src="js/main.js"></script>
</body>
</html>
